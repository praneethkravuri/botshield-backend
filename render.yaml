services:
  - type: web
    name: bot-shield
    env: node
    plan: starter
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run setup && npm run start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bot-shield-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SCOPES
        value: write_app_proxy
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: BOTSHIELD_SIGNING_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: IPAPI_IS_KEY
        sync: false
      - key: SHOPIFY_APP_HANDLE
        sync: false
      - key: SHOPIFY_PUBLIC_PLAN_HANDLE
        value: basic
      - key: SHOPIFY_PARTNER_ORG_ID
        sync: false
      - key: SHOPIFY_PARTNER_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_PARTNER_APP_ID
        sync: false
      - key: SHOPIFY_PARTNER_API_VERSION
        value: "2026-07"
      - key: SHOPIFY_TEST_PLAN_HANDLE
        sync: false
      - key: BILLING_REFRESH_INTERVAL_MS
        value: "900000"
      - key: BILLING_PLAN_NAME
        value: BotShield Basic
      - key: BILLING_MONTHLY_PRICE
        value: "29"
      - key: BILLING_TRIAL_DAYS
        value: "7"
      - key: BILLING_ENFORCEMENT_ENABLED
        value: "false"
      - key: VITE_SUPPORT_EMAIL
        sync: false

databases:
  - name: bot-shield-db
    databaseName: botshield
    user: botshield
    plan: basic-256mb
