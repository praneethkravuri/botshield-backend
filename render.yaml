services:
  - type: web
    name: bot-shield
    env: node
    plan: starter
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run setup && npm run start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bot-shield-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SCOPES
        value: write_app_proxy
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: BOTSHIELD_SIGNING_SECRET
        generateValue: true

databases:
  - name: bot-shield-db
    databaseName: botshield
    user: botshield
    plan: basic-256mb
