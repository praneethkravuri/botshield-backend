services:
  postgres:
    image: postgres:16-alpine
    container_name: botshield-dev-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: botshield
      POSTGRES_PASSWORD: botshield_dev
      POSTGRES_DB: botshield_dev
    volumes:
      - botshield_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botshield -d botshield_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  botshield_dev_postgres_data:
